# Dataset config: Weather augmentation (rain/snow style transfer)
dataset:
  name: weather
  variant: weather
  tsv_description: ${paths.lmu_data_root}/CSAug_weather_500.tsv
  tsv_vqa_rule1: ${paths.lmu_data_root}/CSAug_Rule1_weather_500.tsv
  image_root: ${paths.augmentation_root}/weather/construction_site_test/day/filtered
  annotation_dir: ${paths.augmentation_root}/weather/construction_site_test/day/filtered
  # Weather has multiple styles - images spread across style dirs
  weather_styles:
    - style_rain_0
    - style_rain_1
    - style_rain_2
    - style_snow_0
    - style_snow_1
    - style_snow_2
  # Reference annotations (same as original - violations unchanged by style transfer)
  ref_descriptions: ${paths.annotation_root}/random1_references.json
  ref_vqa: ${paths.annotation_root}/random1_vqa_references.json
  ref_objects:
    excavator: ${paths.annotation_root}/excavator.json
    workers: ${paths.annotation_root}/workers.json
    rebars: ${paths.annotation_root}/rebars.json
  ref_vqa_bbox:
    rule1: ${paths.annotation_root}/vqa_rule1_bbox_references.json
    rule2: ${paths.annotation_root}/vqa_rule2_bbox_references.json
    rule3: ${paths.annotation_root}/vqa_rule3_bbox_references.json
    rule4: ${paths.annotation_root}/vqa_rule4_bbox_references.json
