# Dataset config: Original (no augmentation)
dataset:
  name: original
  variant: original
  tsv_description: ${paths.lmu_data_root}/CSAug_original_500.tsv
  tsv_vqa_rule1: ${paths.lmu_data_root}/CSAug_Rule1_original_500.tsv
  image_root: ${paths.augmentation_root}/construction_site-test/images
  annotation_dir: ${paths.augmentation_root}/construction_site-test/annotations
  # Reference annotations from 10k dataset
  ref_descriptions: ${paths.annotation_root}/random1_references.json
  ref_vqa: ${paths.annotation_root}/random1_vqa_references.json
  ref_objects:
    excavator: ${paths.annotation_root}/excavator.json
    workers: ${paths.annotation_root}/workers.json
    rebars: ${paths.annotation_root}/rebars.json
  ref_vqa_bbox:
    rule1: ${paths.annotation_root}/vqa_rule1_bbox_references.json
    rule2: ${paths.annotation_root}/vqa_rule2_bbox_references.json
    rule3: ${paths.annotation_root}/vqa_rule3_bbox_references.json
    rule4: ${paths.annotation_root}/vqa_rule4_bbox_references.json
