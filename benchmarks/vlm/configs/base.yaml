# Base configuration for Benchmark Runner
# All dataset-specific configs inherit from this

# === Paths ===
# Override at runtime via environment variables (see ConSynth-X/.env.example):
#   CONSYNTH_DATA_ROOT   → augmentation_root + annotation_root (sibling-relative)
#   CONSYNTH_REPO_ROOT   → output_root
# Or edit these values directly.
paths:
  lmu_data_root: ${HOME}/LMUData
  augmentation_root: ${CONSYNTH_DATA_ROOT}/augmentation_data
  annotation_root: ${CONSYNTH_ANNOTATION_ROOT}
  output_root: ${CONSYNTH_REPO_ROOT}/benchmarks/vlm/output

# === Inference defaults ===
inference:
  temperature: 0.2
  max_new_tokens: 1024
  batch_size: 1
  num_workers: 4
  seed: 42
  checkpoint_every: 1  # save after every N images
  resume: true          # auto-resume from checkpoint

# === Evaluation defaults ===
evaluation:
  iou_grid_size: 100
  positive_only: true
