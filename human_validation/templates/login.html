{% extends "base.html" %}
{% block title %}Login - ConSynth-X Validation{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card login-card">
        <h1>ConSynth-X</h1>
        <p class="subtitle">Human Perceptual Validation Platform</p>

        <form method="POST">
            <div class="form-group">
                <label for="username">Name</label>
                <input type="text" id="username" name="username" placeholder="Your name" required autofocus>
            </div>
            <div class="form-group">
                <label for="email">Email (optional)</label>
                <input type="email" id="email" name="email" placeholder="your@email.com">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Start Evaluation</button>
        </form>
    </div>
</div>
{% endblock %}
