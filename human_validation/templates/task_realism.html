{% extends "base.html" %}
{% block title %}Realism Rating - ConSynth-X Validation{% endblock %}

{% block content %}
<div class="container">
    <div class="progress-bar-container">
        <span class="progress-text">{{ done }} / {{ total }}</span>
        <div class="progress-bar">
            <div class="progress-bar-fill" style="width: {{ (done / total * 100) if total > 0 else 0 }}%"></div>
        </div>
    </div>

    <div class="card" style="padding: 1rem 1.5rem;">
        <p style="text-align:center; font-weight: 500;">How realistic does the <strong>weather/lighting condition</strong> in this image look?</p>
    </div>

    <div class="task-image-container">
        <img id="task-image" src="{{ url_for('static', filename=image['filename']) }}" alt="Evaluation image">
    </div>

    <div class="likert-scale">
        <label class="likert-option" onclick="submitScore(1)">
            <input type="radio" name="score" value="1">
            <div class="likert-circle">1</div>
            <span class="likert-label">Completely fake</span>
        </label>
        <label class="likert-option" onclick="submitScore(2)">
            <input type="radio" name="score" value="2">
            <div class="likert-circle">2</div>
            <span class="likert-label">Mostly fake</span>
        </label>
        <label class="likert-option" onclick="submitScore(3)">
            <input type="radio" name="score" value="3">
            <div class="likert-circle">3</div>
            <span class="likert-label">Neutral</span>
        </label>
        <label class="likert-option" onclick="submitScore(4)">
            <input type="radio" name="score" value="4">
            <div class="likert-circle">4</div>
            <span class="likert-label">Mostly realistic</span>
        </label>
        <label class="likert-option" onclick="submitScore(5)">
            <input type="radio" name="score" value="5">
            <div class="likert-circle">5</div>
            <span class="likert-label">Completely real</span>
        </label>
    </div>

    <p class="shortcut-hint">Keyboard: <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> <kbd>5</kbd></p>
</div>
{% endblock %}

{% block scripts %}
<script>
const IMAGE_ID = {{ image['id'] }};
let startTime = Date.now();
let submitted = false;

function submitScore(score) {
    if (submitted) return;
    submitted = true;

    const elapsed = Date.now() - startTime;
    document.querySelectorAll('.likert-option input')[score - 1].checked = true;

    fetch('/api/realism', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({image_id: IMAGE_ID, score: score, response_ms: elapsed})
    }).then(() => {
        setTimeout(() => window.location.reload(), 200);
    });
}

document.addEventListener('keydown', (e) => {
    if (submitted) return;
    const num = parseInt(e.key);
    if (num >= 1 && num <= 5) submitScore(num);
});
</script>
{% endblock %}
