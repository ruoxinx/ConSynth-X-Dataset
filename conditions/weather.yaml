# ConSynth-X — Weather condition definitions
#
# Canonical config describing each weather condition produced by (or annotated
# in) ConSynth-X. Kept in sync with:
#   - taxonomy/extreme_conditions_definition.md (label names)
#   - docs/methods.md §1.2-1.4 (parameter justifications)
#   - generation/AUGMENTATION_REPORT.md (pipeline description)
#   - dataset_card.md (row counts, Kaggle sample composition)
#
# Scope (decision 2026-04-21, CLAUDE.md):
#   Main rain/snow pipeline = IP2P diffusion + physics overlay.
#   VGG Neural Style Transfer is ablation-only; see weather_style_* entries.

schema_version: "0.2"
last_updated: "2026-04-22"

weather:

  clear:
    description: "Baseline — no adverse weather, normal visibility, daylight conditions."
    role: baseline
    method: none
    provenance: manual
    annotation_handling: unchanged

  rain:
    description: "Light/default rain — IP2P atmospheric edit + physics rain streaks + fog haze."
    intensity: light
    method: ip2p_diffusion + physics_overlay
    params:
      ip2p_model: "timbrooks/instruct-pix2pix"
      prompt: "a rainy day with dark overcast sky, rain falling, grey clouds"
      guidance_scale: 10.0
      image_guidance_scale: 1.5
      num_inference_steps: 30
      physics_intensity: "heavy"        # default in add_natural_rain(); see physics.py
      fog_strength: [0.15, 0.30]
      quality_filter:
        ssim: [0.60, 0.95]
        lpips_max: 0.35
    source:
      worker: "generation/weather/rain_snow/diffusion/batch_worker.py"
      physics: "generation/weather/rain_snow/diffusion/physics.py (intensity='heavy')"
    provenance: rule_based
    annotation_handling: copied_verbatim
    notes: >
      Prompt v2 (2026-04-08). Prompt v1 ("...wet muddy ground") was deprecated
      because it induced IP2P to hallucinate puddles/mud and distort ground
      texture, dropping ~48% of rain images post-filter. Current prompt keeps
      edits atmospheric; physics module handles particles. See docs/methods.md
      §1.2 Method 2 for incident write-up.

  rain_heavy:
    description: "Heavy rain — same IP2P light output + stronger physics overlay only; no additional diffusion pass."
    intensity: heavy
    method: physics_overlay_only        # NOT a second diffusion; applied on top of `rain` (light) output
    params:
      physics_intensity: "heavy_fog"    # add_natural_rain(arr, intensity='heavy_fog')
      fog_strength: [0.30, 0.45]        # ~2x default 'heavy'
      streak_layers:
        far:  {n: [3000, 4500], length_px: [12, 26], thickness_px: 1,      alpha: 0.35}
        mid:  {n: [2200, 3600], length_px: [22, 42], thickness_px: [1, 2], alpha: 0.48}
        near: {n: [900,  1600], length_px: [30, 60], thickness_px: [2, 3], alpha: 0.55}
      post_blur: {kernel: 5, sigma: 1.3}
      determinism: "random.seed(seed_base + image_index), seed_base=42"
      pairing: "1:1 image_id with rain (light) — metadata copied verbatim"
    source:
      worker: "generation/weather/rain_snow/diffusion/apply_heavy_physics_to_light.py"
      physics: "generation/weather/rain_snow/diffusion/physics.py (intensity='heavy_fog')"
    provenance: rule_based
    annotation_handling: copied_from_light_stage
    notes: >
      Chosen over a second diffusion pass after 5 pilots (v1-v5) failed to
      produce a perceptually strong, hallucination-free heavy variant
      (DEVLOG 2026-04-21). Deterministic, CPU-only, zero GPU hours.
      Post-hoc DINOv3 ViT-L/16 vs original: mean 0.754 (SSIM 0.522);
      91.7% pass DINO >= 0.75 for light vs 39.8% for heavy — expected.

  snow_light:
    description: "Light snow — IP2P atmospheric edit + physics snowflakes."
    intensity: light
    method: ip2p_diffusion + physics_overlay
    params:
      prompt: "a cold winter day with snow, frost on surfaces, grey sky, snow on the ground"
      guidance_scale: 8.0
      image_guidance_scale: 1.5
      num_inference_steps: 30
      quality_filter:
        ssim: [0.50, 0.95]
    source:
      worker: "generation/weather/rain_snow/diffusion/batch_worker.py"
    provenance: rule_based
    annotation_handling: copied_verbatim
    notes: >
      VLM Jury acceptance (2026-04-15): InternVL 30%, Phi-4 8%, Qwen 4% —
      hence the snow_heavy variant below.

  snow_heavy:
    description: "Heavy snow — IP2P with stronger guidance; surfaces visibly covered."
    intensity: heavy
    method: ip2p_diffusion + physics_overlay
    params:
      prompt: "a cold winter day with heavy snow, thick snow covering the ground and surfaces, grey overcast sky, snowfall"
      guidance_scale: 12.0
      image_guidance_scale: 1.2
      num_inference_steps: 30
      quality_filter: "--no-filter (post-hoc DINO/SSIM in validation/results/snow_strong_dino_ssim.csv)"
    source:
      worker: "generation/weather/rain_snow/diffusion/batch_worker.py (CLI --guidance-scale 12.0)"
    provenance: rule_based
    annotation_handling: copied_verbatim
    notes: >
      Added 2026-04-19. VLM Jury acceptance (2026-04-18, 3004 images):
      InternVL 89.3%, Phi-4 92.3%, Qwen 8.9%. Qwen stays strict on snow
      across both variants — known VLM bias (cf. Ruck et al. 2026).

  fog_light:
    description: "Light haze — Koschmieder atmospheric scattering, visibility 750-1000 m."
    intensity: light
    method: koschmieder_scattering + depth_anything_v2
    params:
      visibility_range_m: [750, 1000]
      visibility_molecule_m: 12
      fog_color_rgb: [170, 175, 185]
      depth_model: "depth-anything/Depth-Anything-V2-Large"
    source:
      worker: "generation/weather/fog/diffusion/arrow_fog_worker.py (label='light')"
      generator: "generation/weather/fog/diffusion/fog_gen.py"
    provenance: rule_based
    annotation_handling: copied_verbatim
    aliases: [haze]                     # taxonomy alias — WeatherBench compatibility (docs/methods.md §~377)

  fog_medium:
    description: "Medium fog — visibility 500-750 m; moderate contrast reduction."
    intensity: medium
    method: koschmieder_scattering + depth_anything_v2
    params:
      visibility_range_m: [500, 750]
      visibility_molecule_m: 12
      fog_color_rgb: [170, 175, 185]
      depth_model: "depth-anything/Depth-Anything-V2-Large"
    source:
      worker: "generation/weather/fog/diffusion/arrow_fog_worker.py (label='medium')"
    provenance: rule_based
    annotation_handling: copied_verbatim

  fog_heavy:
    description: "Heavy/dense fog — visibility 300-500 m; distant regions saturated to fog color."
    intensity: heavy
    method: koschmieder_scattering + depth_anything_v2
    params:
      visibility_range_m: [300, 500]
      visibility_molecule_m: 12
      fog_color_rgb: [170, 175, 185]
      depth_model: "depth-anything/Depth-Anything-V2-Large"
    source:
      worker: "generation/weather/fog/diffusion/arrow_fog_worker.py (label='heavy')"
    provenance: rule_based
    annotation_handling: copied_verbatim
    notes: >
      Best CLIP domain-gap closure vs ACDC/WeatherBench fog subsets
      (docs/methods.md §~392); primary fog reference for downstream eval.

  wet_surface:
    description: "Ground or equipment visibly wet — co-occurs with `rain` / `rain_heavy`."
    role: annotation_only               # not a standalone synthesis target
    method: cooccurrence_label
    provenance: manual
    annotation_handling: multi_label_tag
    cooccurs_with: [rain, rain_heavy, night_rain]

  # ---- Ablation archive (legacy VGG Neural Style Transfer) ----------------
  # Kept for realism-vs-recognizability baseline in paper; not part of main
  # pipeline. Data + code: experiments/ablation_style_transfer/.
  # Row counts intentionally omitted here — see dataset_card.md for canonical
  # numbers. DO NOT add to main-dataset totals.
  weather_style_rain:
    description: "ABLATION — VGG19 NST rain tone + MiDaS-guided physics streaks + SSIM filter. 3 style references (style_rain_{0,1,2})."
    status: ablation_only
    archived_since: "2026-04-21"
    method: vgg_neural_style_transfer + midas_depth + physics_overlay + ssim_filter
    params:
      style_refs: [style_rain_0, style_rain_1, style_rain_2]
      depth_model: "MiDaS DPT_Large"
      style_weight_conflict: "10000 (workers) vs 100000 (pipelines) — UNRESOLVED, ablation-only"
      steps_conflict: "10 (workers) vs 50 (pipelines) — UNRESOLVED, ablation-only"
      ssim_filter: [0.50, 0.95]
    source:
      archive: "experiments/ablation_style_transfer/"
      code: "generation/weather/rain_snow/style_transfer/"
    provenance: rule_based
    annotation_handling: copied_verbatim

  weather_style_snow:
    description: "ABLATION — VGG19 NST snow tone + MiDaS-guided physics flakes + SSIM filter. 3 style references (style_snow_{0,1,2})."
    status: ablation_only
    archived_since: "2026-04-21"
    method: vgg_neural_style_transfer + midas_depth + physics_overlay + ssim_filter
    params:
      style_refs: [style_snow_0, style_snow_1, style_snow_2]
      depth_model: "MiDaS DPT_Large"
      ssim_filter: [0.50, 0.95]
    source:
      archive: "experiments/ablation_style_transfer/"
      code: "generation/weather/rain_snow/style_transfer/"
    provenance: rule_based
    annotation_handling: copied_verbatim
