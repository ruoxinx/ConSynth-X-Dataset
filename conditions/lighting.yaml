# ConSynth-X — Lighting condition definitions
#
# Distinguishes:
#   - `nighttime` (SYNTHESIZED via CycleGAN-Turbo day2night), and the compound
#     `night_rain` / `night_snow` variants, from
#   - annotation-only lighting tags (low_light, backlit, glare, shadow_heavy),
#     which are applied to real images where no synthesis pipeline is used.
#
# Kept in sync with taxonomy/extreme_conditions_definition.md,
# docs/methods.md §1.2 Method 3, generation/AUGMENTATION_REPORT.md §3-4.

schema_version: "0.2"
last_updated: "2026-04-22"

lighting:

  daylight:
    description: "Baseline — normal daytime illumination on real construction imagery."
    role: baseline
    method: none
    provenance: manual
    annotation_handling: unchanged

  nighttime:
    description: "Synthesized night variant via CycleGAN-Turbo day_to_night. Artificial lighting, high contrast, deep shadows."
    method: cyclegan_turbo_day2night
    params:
      checkpoint: "day_to_night (img2img-turbo, Parmar et al.)"
      internal_resolution_px: [512, 512]
      upscale_interp: "LANCZOS"
      precision: "fp16"
      mapping: "1:1 (every input image -> exactly one night variant)"
    source:
      arrow_worker: "generation/day2night/day2night_batch_worker.py"
      voc_worker: "generation/day2night/day2night_soda_worker.py"
    provenance: rule_based
    annotation_handling: copied_verbatim
    notes: >
      Global illumination transform — object positions unchanged. Validated
      via CLIP/DINOv3 domain-gap reduction vs ACDC night subset (strongest
      reduction among all conditions, ~38%; docs/methods.md §~629).

  night_rain:
    description: "Compound — nighttime + rain. Chain: CycleGAN night -> IP2P (night-specific rain prompt) -> physics rain overlay."
    method: cyclegan_turbo + ip2p_diffusion + physics_overlay
    params:
      order: "night_first"              # see design decision below
      ip2p_prompt: "a rainy night with rain falling, wet reflections on surfaces, dark overcast sky"
      guidance_scale: 10.0
      image_guidance_scale: 1.5
      num_inference_steps: 30
      physics: "add_natural_rain() — 3-layer streaks + atmospheric fog"
      quality_filter:
        ssim: [0.60, 0.95]              # vs ORIGINAL day image, not vs night intermediate
        lpips_max: 0.35
    source:
      worker: "generation/weather/rain_snow/diffusion/night_weather_batch_worker.py"
      submitter: "generation/weather/rain_snow/diffusion/submit_night_weather_test.py"
    provenance: rule_based
    annotation_handling: copied_verbatim
    design_decisions:
      - "Night-first order: CycleGAN is 1:1 (no drop); IP2P + filter may drop, so it runs last."
      - "Night-specific prompt: references reflections/artificial light (day prompt would mis-edit toward overcast sky)."
      - "SSIM/LPIPS measured vs ORIGINAL day image — total visual distance from source, not from night intermediate."

  night_snow:
    description: "Compound — nighttime + snow. Chain: CycleGAN night -> IP2P (night-specific snow prompt) -> physics snow overlay."
    method: cyclegan_turbo + ip2p_diffusion + physics_overlay
    params:
      order: "night_first"
      ip2p_prompt: "a cold winter night with snow falling, frost on surfaces, snow on the ground"
      guidance_scale: 8.0
      image_guidance_scale: 1.5
      num_inference_steps: 30
      physics: "add_natural_snow() — 3-layer flakes + screen blend"
      quality_filter:
        ssim: [0.50, 0.95]              # vs ORIGINAL day image
        lpips: not_applied               # matches day snow pipeline
    source:
      worker: "generation/weather/rain_snow/diffusion/night_weather_batch_worker.py"
    provenance: rule_based
    annotation_handling: copied_verbatim

  # ---- Annotation-only lighting tags (no synthesis pipeline) --------------
  # These label real imagery; they are NOT produced by a generator.
  low_light:
    description: "Real image underexposed or shot at dusk/dawn; overall low luminance."
    role: annotation_only
    provenance: "manual | rule_based (luminance threshold)"
    annotation_handling: multi_label_tag
    notes: "Distinct from `nighttime` — no artificial-light sources required."

  backlit:
    description: "Strong backlighting causing silhouettes and foreground detail loss (sun/lamp behind subjects)."
    role: annotation_only
    provenance: manual
    annotation_handling: multi_label_tag

  glare:
    description: "Specular highlights or lens flare saturating local regions."
    role: annotation_only
    provenance: manual
    annotation_handling: multi_label_tag

  shadow_heavy:
    description: "Pronounced cast shadows occluding object regions."
    role: annotation_only
    provenance: manual
    annotation_handling: multi_label_tag
