# ConSynth-X — Image-quality / sensor-degradation condition definitions
#
# As of 2026-04-22 these are **annotation-only** labels (Taxonomy §4). There
# is no dedicated synthesis pipeline in generation/ for motion/defocus blur,
# sensor noise, low-resolution, or compression artifacts — such artifacts can
# co-occur in real images or be introduced incidentally by other pipelines
# (e.g. the rain_heavy physics overlay includes a Gaussian blur σ=1.3 that
# simulates reduced visibility; this is a *side effect*, not a primary
# sensor_noise generator).
#
# Kept in sync with taxonomy/extreme_conditions_definition.md §4.

schema_version: "0.2"
last_updated: "2026-04-22"

noise:

  motion_blur:
    description: "Directional blur from camera or object motion."
    role: annotation_only
    provenance: "manual | rule_based (blur metric)"
    annotation_handling: multi_label_tag
    synthesis_status: not_implemented
    incidental_sources: []              # none in current pipelines

  defocus_blur:
    description: "Out-of-focus blur (depth-of-field)."
    role: annotation_only
    provenance: manual
    annotation_handling: multi_label_tag
    synthesis_status: not_implemented

  gaussian_noise:
    description: "Sensor noise / high-ISO grain."
    role: annotation_only
    provenance: "manual | rule_based (std estimate)"
    annotation_handling: multi_label_tag
    synthesis_status: not_implemented

  low_resolution:
    description: "Downsampled / intrinsically low-resolution crops."
    role: annotation_only
    provenance: "manual | rule_based (pixel footprint threshold)"
    annotation_handling: multi_label_tag
    synthesis_status: not_implemented
    notes: >
      For scale degradation with annotation preservation use `scale.small`
      (FLUX outpainting). Naive downscaling is intentionally NOT used —
      see generation/AUGMENTATION_REPORT.md §9 "Outpainting over downscaling".

  compression_artifacts:
    description: "Visible JPEG / codec artifacts (block structure, ringing)."
    role: annotation_only
    provenance: "manual | rule_based (BRISQUE/NIQE)"
    annotation_handling: multi_label_tag
    synthesis_status: not_implemented

# Incidental degradation occurring inside main pipelines — NOT a standalone
# condition. Documented here so downstream evaluation does not mistakenly
# attribute observed blur solely to a sensor_noise label.
incidental:
  rain_heavy_post_blur:
    source_condition: weather.rain_heavy
    effect: "Gaussian blur kernel 5x5, sigma=1.3"
    purpose: "Emulate reduced visibility / lens scattering under heavy rain."
    ref: "generation/weather/rain_snow/diffusion/physics.py (intensity='heavy_fog')"
