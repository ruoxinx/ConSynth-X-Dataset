# Condition registry for ConSynth-X release v1.
#
# Single source of truth mapping every input shard to its sub, format,
# condition labels, pipeline provenance, and DINO score CSV.
#
# Coverage policy for v1:
#   - Include only shards with DINO scores available (validation/results/dino_ssim/*.csv).
#   - Original / no-source shards (cs10k_original, soda_voc_original, soda_ktsh_original)
#     are excluded from v1 because the production augmentation_data/ doesn't yet hold
#     the canonical originals; the augmentation_data_sample/ pilot covered those.
#   - Outpainting (small) and fog/night/original for soda_voc/soda_ktsh are PENDING DINO;
#     listed in pending_dino_shards.yaml for v1.x re-run.
#
# Drop list (NOT released):
#   - soda_voc/_b2_inputs/*  : pre-diffusion staging input subsets
#   - soda_voc/_b2_outputs/* : pre-finalisation 1k subset of rain_light/snow_light
#   - soda_ktsh/fog/test/<intensity>/<batch>.arrow : per-batch shards already
#     concatenated into soda_ktsh/fog/<intensity>.arrow at parent level

version: 1
release_name: "consynth-x-release-v1"
dino_alert_threshold: 0.75

pipelines:
  none_original:
    method: "original"
    checkpoint: ""
    prompt_template: ""
    params: '{}'
  ip2p_rain:
    method: "ip2p"
    checkpoint: "instruct-pix2pix"
    prompt_template: "make it raining"
    params: '{"physics_overlay": true, "filter": "lpips_ssim"}'
  ip2p_snow:
    method: "ip2p"
    checkpoint: "instruct-pix2pix"
    prompt_template: "make it snowing"
    params: '{"physics_overlay": true, "filter": "lpips_ssim"}'
  fog_overlay:
    method: "fog_overlay"
    checkpoint: ""
    prompt_template: ""
    params: '{"depth_model": "MiDaS"}'
  day2night:
    method: "day2night"
    checkpoint: "img2img-turbo/day2night.pkl"
    prompt_template: ""
    params: '{}'
  outpaint_flux:
    method: "outpainting"
    checkpoint: "FLUX.1-dev"
    prompt_template: "extend the construction scene"
    params: '{"resize_input": 0.5}'

shards:
  # ========================== cs10k (13 shards) ==========================
  - path: "augmentation_data/construction_site/fog/diffusion/test/fog_heavy.arrow"
    sub: "cs10k"
    format: "cs10k_columns"
    condition: "fog_heavy"
    condition_labels: ["fog", "heavy"]
    pipeline: fog_overlay
    dino_scores_path: "validation/results/dino_ssim/fog_heavy.csv"

  - path: "augmentation_data/construction_site/fog/diffusion/test/fog_medium.arrow"
    sub: "cs10k"
    format: "cs10k_columns"
    condition: "fog_medium"
    condition_labels: ["fog", "medium"]
    pipeline: fog_overlay
    dino_scores_path: "validation/results/dino_ssim/fog_medium.csv"

  - path: "augmentation_data/construction_site/fog/diffusion/test/fog_light.arrow"
    sub: "cs10k"
    format: "cs10k_columns"
    condition: "fog_light"
    condition_labels: ["fog", "light"]
    pipeline: fog_overlay
    dino_scores_path: "validation/results/dino_ssim/fog_light.csv"

  - path: "augmentation_data/construction_site/night/test/night_constructionsite_test.arrow"
    sub: "cs10k"
    format: "cs10k_json"     # cs_night format-B (annotation JSON)
    condition: "night"
    condition_labels: ["night"]
    pipeline: day2night
    dino_scores_path: "validation/results/dino_ssim/night.csv"

  - path: "augmentation_data/construction_site/night_weather/rain_night/rain_night.arrow"
    sub: "cs10k"
    format: "cs10k_json"     # variant 2 has annotation field
    condition: "rain_night"
    condition_labels: ["rain", "night", "diffusion"]
    pipeline: ip2p_rain
    dino_scores_path: "validation/results/dino_ssim/night_rain.csv"

  - path: "augmentation_data/construction_site/night_weather/snow_night/snow_night.arrow"
    sub: "cs10k"
    format: "cs10k_json"
    condition: "snow_night"
    condition_labels: ["snow", "night", "diffusion"]
    pipeline: ip2p_snow
    dino_scores_path: "validation/results/dino_ssim/night_snow.csv"

  - path: "augmentation_data/construction_site/rain_snow/diffusion/test/rain_heavy/rain_heavy.arrow"
    sub: "cs10k"
    format: "cs10k_columns"
    condition: "rain_heavy"
    split: "test"
    condition_labels: ["rain", "heavy", "diffusion"]
    pipeline: ip2p_rain
    dino_scores_path: "validation/results/dino_ssim/ip2p_rain_heavy.csv"

  - path: "augmentation_data/construction_site/rain_snow/diffusion/test/rain_light/rain_light.arrow"
    sub: "cs10k"
    format: "cs10k_columns"
    condition: "rain_light"
    split: "test"
    condition_labels: ["rain", "light", "diffusion"]
    pipeline: ip2p_rain
    dino_scores_path: "validation/results/dino_ssim/ip2p_rain.csv"

  - path: "augmentation_data/construction_site/rain_snow/diffusion/test/snow_light/snow_light.arrow"
    sub: "cs10k"
    format: "cs10k_columns"
    condition: "snow_light"
    split: "test"
    condition_labels: ["snow", "light", "diffusion"]
    pipeline: ip2p_snow
    dino_scores_path: "validation/results/dino_ssim/ip2p_snow_light.csv"

  - path: "augmentation_data/construction_site/rain_snow/diffusion/test/snow_heavy/snow_heavy.arrow"
    sub: "cs10k"
    format: "cs10k_columns"
    condition: "snow_heavy"
    split: "test"
    condition_labels: ["snow", "heavy", "diffusion"]
    pipeline: ip2p_snow
    dino_scores_path: "validation/results/dino_ssim/ip2p_snow_heavy.csv"

  - path: "augmentation_data/construction_site/rain_snow/diffusion/train/rain_heavy/rain_heavy.arrow"
    sub: "cs10k"
    format: "cs10k_columns"
    condition: "rain_heavy"
    split: "train"
    condition_labels: ["rain", "heavy", "diffusion"]
    pipeline: ip2p_rain
    dino_scores_path: "validation/results/dino_ssim/cs_train_rain_heavy.csv"

  - path: "augmentation_data/construction_site/rain_snow/diffusion/train/rain_light/rain_light.arrow"
    sub: "cs10k"
    format: "cs10k_columns"
    condition: "rain_light"
    split: "train"
    condition_labels: ["rain", "light", "diffusion"]
    pipeline: ip2p_rain
    dino_scores_path: "validation/results/dino_ssim/cs_train_rain_light.csv"

  - path: "augmentation_data/construction_site/rain_snow/diffusion/train/snow_heavy/snow_heavy.arrow"
    sub: "cs10k"
    format: "cs10k_columns"
    condition: "snow_heavy"
    split: "train"
    condition_labels: ["snow", "heavy", "diffusion"]
    pipeline: ip2p_snow
    dino_scores_path: "validation/results/dino_ssim/cs_train_snow_heavy.csv"

  - path: "augmentation_data/construction_site/rain_snow/diffusion/train/snow_light/snow_light.arrow"
    sub: "cs10k"
    format: "cs10k_columns"
    condition: "snow_light"
    split: "train"
    condition_labels: ["snow", "light", "diffusion"]
    pipeline: ip2p_snow
    dino_scores_path: "validation/results/dino_ssim/cs_train_snow_light.csv"

  # ========================== soda_voc (4 shards) ==========================
  - path: "augmentation_data/soda_voc/rain_snow/diffusion/rain_heavy.arrow"
    sub: "soda_voc"
    format: "voc_xml"
    condition: "rain_heavy"
    condition_labels: ["rain", "heavy", "diffusion"]
    pipeline: ip2p_rain
    dino_scores_path: "validation/results/dino_ssim/soda_voc_rain_heavy.csv"

  - path: "augmentation_data/soda_voc/rain_snow/diffusion/rain_light.arrow"
    sub: "soda_voc"
    format: "voc_xml"
    condition: "rain_light"
    condition_labels: ["rain", "light", "diffusion"]
    pipeline: ip2p_rain
    dino_scores_path: "validation/results/dino_ssim/soda_voc_rain_light.csv"

  - path: "augmentation_data/soda_voc/rain_snow/diffusion/snow_light.arrow"
    sub: "soda_voc"
    format: "voc_xml"
    condition: "snow_light"
    condition_labels: ["snow", "light", "diffusion"]
    pipeline: ip2p_snow
    dino_scores_path: "validation/results/dino_ssim/soda_voc_snow_light.csv"

  - path: "augmentation_data/soda_voc/rain_snow/diffusion/snow_heavy.arrow"
    sub: "soda_voc"
    format: "join_from_source"   # this shard lacks 'annotation' column, has only ssim/lpips/status/ref_id
    # Use soda_voc/original as join source (full 1000/1000 coverage). snow_light
    # was missing 11 ids (hd1255, hd1349, hd1352, hd1670, hd1752, ...).
    join_source: "augmentation_data/soda_voc/original/soda_voc_original_first3000.arrow"
    join_source_format: "voc_xml"
    condition: "snow_heavy"
    condition_labels: ["snow", "heavy", "diffusion"]
    pipeline: ip2p_snow
    dino_scores_path: "validation/results/dino_ssim/soda_voc_snow_heavy.csv"
    notes: "snow_heavy has only 1000 rows (incomplete production batch); release the 1000 we have, joining bbox from soda_voc/original."

  # ========================== soda_ktsh (4 shards) ==========================
  - path: "augmentation_data/soda_ktsh/rain_snow/diffusion/rain_heavy.arrow"
    sub: "soda_ktsh"
    format: "ktsh_caption_only"
    condition: "rain_heavy"
    condition_labels: ["rain", "heavy", "diffusion"]
    pipeline: ip2p_rain
    dino_scores_path: "validation/results/dino_ssim/soda_ktsh_rain_heavy.csv"

  - path: "augmentation_data/soda_ktsh/rain_snow/diffusion/rain_light.arrow"
    sub: "soda_ktsh"
    format: "ktsh_caption_only"
    condition: "rain_light"
    condition_labels: ["rain", "light", "diffusion"]
    pipeline: ip2p_rain
    dino_scores_path: "validation/results/dino_ssim/soda_ktsh_rain_light.csv"

  - path: "augmentation_data/soda_ktsh/rain_snow/diffusion/snow_heavy.arrow"
    sub: "soda_ktsh"
    format: "ktsh_caption_only"
    condition: "snow_heavy"
    condition_labels: ["snow", "heavy", "diffusion"]
    pipeline: ip2p_snow
    dino_scores_path: "validation/results/dino_ssim/soda_ktsh_snow_heavy.csv"
    caption_join_sources:
      - "augmentation_data/soda_ktsh/rain_snow/diffusion/snow_light.arrow"
      - "augmentation_data/soda_ktsh/rain_snow/diffusion/rain_light.arrow"
      - "augmentation_data/soda_ktsh/rain_snow/diffusion/rain_heavy.arrow"

  - path: "augmentation_data/soda_ktsh/rain_snow/diffusion/snow_light.arrow"
    sub: "soda_ktsh"
    format: "ktsh_caption_only"
    condition: "snow_light"
    condition_labels: ["snow", "light", "diffusion"]
    pipeline: ip2p_snow
    dino_scores_path: "validation/results/dino_ssim/soda_ktsh_snow_light.csv"

  # ========================== v1.x extension: shards added 2026-04-29 ==========================
  # Added after DINO compute job 5147861 (extract_dino_pending.py).
  # Pack notes:
  #   - soda_voc/small/extra2k.arrow: packed via pack_extra2k.py (bbox transformed source->canvas)
  #   - soda_ktsh/original/soda_ktsh_original.arrow: packed via pack_soda_ktsh_original.py from raw JPGs

  # ---- cs10k small (outpainting, 2 splits) ----
  - path: "augmentation_data/construction_site/small/test/small_constructionsite_test.arrow"
    sub: "cs10k"
    format: "cs10k_json"
    condition: "small"
    split: "test"
    condition_labels: ["small", "outpainting"]
    pipeline: outpaint_flux
    dino_scores_path: "validation/results/dino_ssim/cs_small_test.csv"

  - path: "augmentation_data/construction_site/small/train/small_constructionsite_train.arrow"
    sub: "cs10k"
    format: "cs10k_json"
    condition: "small"
    split: "train"
    condition_labels: ["small", "outpainting"]
    pipeline: outpaint_flux
    dino_scores_path: "validation/results/dino_ssim/cs_small_train.csv"

  # ---- soda_voc night/fog/small ----
  - path: "augmentation_data/soda_voc/night/soda_day2night.arrow"
    sub: "soda_voc"
    format: "voc_xml"
    condition: "night"
    condition_labels: ["night"]
    pipeline: day2night
    dino_scores_path: "validation/results/dino_ssim/soda_voc_night.csv"
    notes: "19846 rows; DINO only matched ~3000 against soda_voc_original_first3000. Remainder will have null quality scores."

  - path: "augmentation_data/soda_voc/fog/test/fog_heavy.arrow"
    sub: "soda_voc"
    format: "voc_xml"
    condition: "fog_heavy"
    condition_labels: ["fog", "heavy"]
    pipeline: fog_overlay
    dino_scores_path: "validation/results/dino_ssim/soda_voc_fog_heavy.csv"

  - path: "augmentation_data/soda_voc/fog/test/fog_medium.arrow"
    sub: "soda_voc"
    format: "voc_xml"
    condition: "fog_medium"
    condition_labels: ["fog", "medium"]
    pipeline: fog_overlay
    dino_scores_path: "validation/results/dino_ssim/soda_voc_fog_medium.csv"

  - path: "augmentation_data/soda_voc/fog/test/fog_light.arrow"
    sub: "soda_voc"
    format: "voc_xml"
    condition: "fog_light"
    condition_labels: ["fog", "light"]
    pipeline: fog_overlay
    dino_scores_path: "validation/results/dino_ssim/soda_voc_fog_light.csv"

  - path: "augmentation_data/soda_voc/small/soda_small.arrow"
    sub: "soda_voc"
    format: "voc_xml"
    condition: "small"
    condition_labels: ["small", "outpainting"]
    pipeline: outpaint_flux
    dino_scores_path: "validation/results/dino_ssim/soda_voc_small.csv"

  - path: "augmentation_data/soda_voc/small/extra2k.arrow"
    sub: "soda_voc"
    format: "voc_xml"
    condition: "small"
    condition_labels: ["small", "outpainting", "extra2k"]
    pipeline: outpaint_flux
    dino_scores_path: "validation/results/dino_ssim/soda_voc_extra2k.csv"

  # ---- soda_ktsh night/fog/small ----
  - path: "augmentation_data/soda_ktsh/night/soda_ktsh_day2night.arrow"
    sub: "soda_ktsh"
    format: "ktsh_caption_only"
    condition: "night"
    condition_labels: ["night"]
    pipeline: day2night
    dino_scores_path: "validation/results/dino_ssim/soda_ktsh_night.csv"

  - path: "augmentation_data/soda_ktsh/fog/fog_heavy.arrow"
    sub: "soda_ktsh"
    format: "ktsh_caption_only"
    condition: "fog_heavy"
    condition_labels: ["fog", "heavy"]
    pipeline: fog_overlay
    dino_scores_path: "validation/results/dino_ssim/soda_ktsh_fog_heavy.csv"
    caption_join_sources:
      - "augmentation_data/soda_ktsh/rain_snow/diffusion/snow_light.arrow"
      - "augmentation_data/soda_ktsh/rain_snow/diffusion/rain_light.arrow"
      - "augmentation_data/soda_ktsh/rain_snow/diffusion/rain_heavy.arrow"

  - path: "augmentation_data/soda_ktsh/fog/fog_medium.arrow"
    sub: "soda_ktsh"
    format: "ktsh_caption_only"
    condition: "fog_medium"
    condition_labels: ["fog", "medium"]
    pipeline: fog_overlay
    dino_scores_path: "validation/results/dino_ssim/soda_ktsh_fog_medium.csv"
    caption_join_sources:
      - "augmentation_data/soda_ktsh/rain_snow/diffusion/snow_light.arrow"
      - "augmentation_data/soda_ktsh/rain_snow/diffusion/rain_light.arrow"
      - "augmentation_data/soda_ktsh/rain_snow/diffusion/rain_heavy.arrow"

  - path: "augmentation_data/soda_ktsh/fog/fog_light.arrow"
    sub: "soda_ktsh"
    format: "ktsh_caption_only"
    condition: "fog_light"
    condition_labels: ["fog", "light"]
    pipeline: fog_overlay
    dino_scores_path: "validation/results/dino_ssim/soda_ktsh_fog_light.csv"
    caption_join_sources:
      - "augmentation_data/soda_ktsh/rain_snow/diffusion/snow_light.arrow"
      - "augmentation_data/soda_ktsh/rain_snow/diffusion/rain_light.arrow"
      - "augmentation_data/soda_ktsh/rain_snow/diffusion/rain_heavy.arrow"

  - path: "augmentation_data/soda_ktsh/small/soda_ktsh_small.arrow"
    sub: "soda_ktsh"
    format: "ktsh_caption_only"
    condition: "small"
    condition_labels: ["small", "outpainting"]
    pipeline: outpaint_flux
    dino_scores_path: "validation/results/dino_ssim/soda_ktsh_small.csv"
