# Shards excluded from ConSynth-X release v1 because DINO score CSV is not yet
# available in validation/results/dino_ssim/. Re-run repack with these added to
# condition_registry.yaml after DINO computation completes.
#
# DO NOT SHIP these shards in v1.
#
# Re-add procedure:
#   1. Compute DINO scores for the synthetic-vs-source pair, save to
#      validation/results/dino_ssim/<name>.csv with header
#      `image_id,ssim,dino_sim,dino_dist`.
#   2. Move the entry from this file into condition_registry.yaml under `shards:`
#      with the appropriate `dino_scores_path`.
#   3. Re-run scripts/repack_to_release.py for just that shard, then update
#      release-level README and dataset card.

version: 1
notes: |
  Originals (cs10k, soda_voc, soda_ktsh) and outpainting (small) are excluded
  for v1 because DINO comparison requires a paired source-synthetic image and
  either (a) the original is the source itself (DINO=1 by definition) or
  (b) the outpainting changes geometry so per-pixel DINO is not directly
  meaningful without a separate validation protocol.
  These will be reconsidered for v1.x once a calibration approach is agreed.

pending_shards:
  # ---- cs10k ----
  - path: "augmentation_data/construction_site/small/test/small_constructionsite_test.arrow"
    sub: "cs10k"
    blocker: "DINO not computed for outpainting; awaiting decision on protocol"
    rows: 1323
  - path: "augmentation_data/construction_site/small/train/small_constructionsite_train.arrow"
    sub: "cs10k"
    blocker: "DINO not computed for outpainting; awaiting decision on protocol"
    rows: 1500

