# Drop list (not pending — will NOT be released in any version):
drop_shards:
  - pattern: "augmentation_data/soda_voc/_b2_inputs/*.arrow"
    reason: "Pre-diffusion staging inputs; subset already covered by rain_snow/diffusion/*"
  - pattern: "augmentation_data/soda_voc/_b2_outputs/**/*.arrow"
    reason: "Per-batch staging outputs (1k subset); finalised data is in rain_snow/diffusion/{rain,snow}_{light,heavy}.arrow"
  - pattern: "augmentation_data/soda_ktsh/fog/test/<intensity>/*.arrow"
    reason: "Per-300 batch shards; concatenated form is at soda_ktsh/fog/<intensity>.arrow"
